<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#f5f5f7"/><stop offset=".46" stop-color="#e5e5e9"/><stop offset="1" stop-color="#cfcfd7"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#383842" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="reflection" cx=".25" cy=".15" r=".85"><stop stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .body{fill:url(#glass)}.letter{fill:#24242a}
    @media(prefers-color-scheme:dark){.body{fill:#303039}.letter{fill:#eeeef3}.reflection{opacity:.13}}
  </style>
  <rect class="body" x="3" y="3" width="58" height="58" rx="17"/>
  <rect class="reflection" x="3" y="3" width="58" height="58" rx="17" fill="url(#reflection)"/>
  <rect x="3.5" y="3.5" width="57" height="57" rx="16.5" fill="none" stroke="url(#rim)"/>
  <text class="letter" x="30.5" y="47" font-family="Georgia,Times New Roman,serif" font-size="56" font-style="italic" text-anchor="middle">a</text>
</svg>
